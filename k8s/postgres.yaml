apiVersion: v1
kind: Secret
metadata: { name: postgres-secret, namespace: osint }
type: Opaque
stringData:
  postgres-password: osint_password # replace via Vault/SealedSecrets
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: osint }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_DB, value: osint }
            - { name: POSTGRES_USER, value: osint }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-secret, key: postgres-password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
          livenessProbe: { exec: { command: ["pg_isready","-U","osint"] }, initialDelaySeconds: 15 }
          readinessProbe: { exec: { command: ["pg_isready","-U","osint"] }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: "250m", memory: "256Mi" }, limits: { memory: "1Gi" } }
      volumes: []
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: osint }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
