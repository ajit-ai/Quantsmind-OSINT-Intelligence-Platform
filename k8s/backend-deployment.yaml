apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: osint }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: osint-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: osint-secrets } }]
