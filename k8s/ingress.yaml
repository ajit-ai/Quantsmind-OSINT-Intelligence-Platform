apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: osint-ingress, namespace: osint, annotations: { nginx.ingress.kubernetes.io/ssl-redirect: "true" } }
spec:
  rules:
    - host: osint.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }] }
  tls: [{ hosts: [osint.example.com], secretName: osint-tls }]
