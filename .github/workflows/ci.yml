name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres: { image: postgres:16-alpine, env: { POSTGRES_DB: osint, POSTGRES_USER: osint, POSTGRES_PASSWORD: osint_password }, ports: ["5432:5432"], options: --health-cmd="pg_isready -U osint" --health-interval=5s --health-timeout=5s --health-retries=10 }
      redis: { image: redis:7-alpine, ports: ["6379:6379"], options: --health-cmd="redis-cli ping" --health-interval=5s }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r backend/requirements.txt
      - run: pip install flake8 bandit pip-audit pytest-cov
      - name: Lint
        run: flake8 backend --max-line-length=120 --exclude=migrations --statistics || true
      - name: Security lint
        run: bandit -r backend -ll || true
      - name: Pip audit
        run: pip-audit --desc || true
      - name: Collect static
        run: python backend/manage.py collectstatic --noinput || true
      - name: Tests
        env: { DJANGO_DEBUG: "1", DATABASE_URL: "postgres://osint:osint_password@localhost:5432/osint", REDIS_URL: "redis://localhost:6379/0", ELASTICSEARCH_URL: "http://localhost:9200" }
        run: pytest backend -q --cov --cov-report=term || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'frontend/package.json' }
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build ./backend -t osint-backend:ci
      - run: docker build ./frontend -t osint-frontend:ci

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: 'trivy-results.sarif' }

  k8s-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -Lo kubeval.tar.gz https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval.tar.gz && ./kubeval k8s/*.yaml || true
